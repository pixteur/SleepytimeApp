<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#342868"/>
      <stop offset="1" stop-color="#6750A4"/>
    </linearGradient>
    <clipPath id="rounded"><rect width="1024" height="1024" rx="232"/></clipPath>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="610" cy="560" r="250" fill="white"/>
      <circle cx="745" cy="480" r="240" fill="black"/>
    </mask>
    <!-- unit 4-point sparkle, outer radius 1, centred at origin -->
    <path id="star" d="M0,-1 L0.33,-0.33 L1,0 L0.33,0.33 L0,1 L-0.33,0.33 L-1,0 L-0.33,-0.33 Z"/>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="url(#sky)"/>

    <g fill="#ffffff">
      <use href="#star" transform="translate(185,205) scale(46)" opacity="0.94"/>
      <use href="#star" transform="translate(315,430) scale(24)" opacity="0.78"/>
      <use href="#star" transform="translate(835,235) scale(40)" opacity="0.92"/>
      <use href="#star" transform="translate(735,460) scale(22)" opacity="0.74"/>
      <use href="#star" transform="translate(865,660) scale(28)" opacity="0.82"/>
      <use href="#star" transform="translate(180,770) scale(30)" opacity="0.84"/>
      <use href="#star" transform="translate(430,835) scale(20)" opacity="0.72"/>
    </g>

    <!-- crescent moon -->
    <rect width="1024" height="1024" fill="#FFF4D6" mask="url(#crescent)"/>

    <!-- sleeping face -->
    <g fill="none" stroke="#4A3A8C" stroke-width="13" stroke-linecap="round">
      <path d="M461,548 q44,-30 88,0"/>
      <path d="M452,567 q53,68 106,0"/>
    </g>
    <circle cx="421" cy="586" r="19" fill="#E996AA" opacity="0.7"/>
  </g>
</svg>
